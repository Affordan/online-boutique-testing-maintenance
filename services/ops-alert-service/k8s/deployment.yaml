apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-alert-service
  namespace: online-boutique
  labels:
    app: ops-alert-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-alert-service
  template:
    metadata:
      labels:
        app: ops-alert-service
        monitoring: enabled
    spec:
      containers:
        - name: ops-alert-service
          image: ops-alert-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
            - name: LATENCY_THRESHOLD
              value: "1.0"
            - name: ERROR_RATE_THRESHOLD
              value: "0.05"
            - name: CPU_THRESHOLD
              value: "0.8"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
