apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-log-service
  namespace: online-boutique
  labels:
    app: user-log-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-log-service
  template:
    metadata:
      labels:
        app: user-log-service
        monitoring: enabled
    spec:
      containers:
        - name: user-log-service
          image: user-log-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
